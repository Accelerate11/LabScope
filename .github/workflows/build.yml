name: Build desktop packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Build ${{ matrix.platform }} x64
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, runner: windows-2025, artifact: LabScope-windows-x64-portable }
          - { platform: linux, runner: ubuntu-24.04, artifact: LabScope-linux-x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm test:runtime
      - if: matrix.platform == 'windows'
        run: pnpm --filter @labscope/desktop package
      - if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $archive = Get-Item 'apps/desktop/release/*-windows-x64-portable.zip'
          $portable = Join-Path $env:RUNNER_TEMP 'labscope-portable'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $portable
          $exe = Join-Path $portable 'LabScope.exe'
          pnpm test:integration $exe --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:simulation-ui $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixture = Join-Path $env:RUNNER_TEMP 'windows-simulation.mcap'
          pnpm fixture:simulation-mcap $fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:mcap-packaged $exe $fixture
      - if: matrix.platform == 'linux'
        shell: bash
        env:
          PACKAGE_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
          PACKAGE_MAINTAINER: ${{ vars.LABSCOPE_DEB_MAINTAINER || format('LabScope maintainers <{0}+{1}@users.noreply.github.com>', github.repository_owner_id, github.repository_owner) }}
        run: |
          pnpm --filter @labscope/desktop package:linux \
            "-c.extraMetadata.homepage=$PACKAGE_HOMEPAGE" \
            "-c.linux.maintainer=$PACKAGE_MAINTAINER"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth ./apps/desktop/release/LabScope-0.1.0-beta.1-linux-amd64.deb
          # Xvfb has no supported GPU. Exercise Chromium's OpenGL ES driver in software.
          exe="$RUNNER_TEMP/labscope-software-gl"
          printf '%s\n' '#!/bin/sh' 'exec /opt/LabScope/labscope --use-gl=angle --use-angle=swiftshader "$@"' > "$exe"
          chmod +x "$exe"
          fixture="$RUNNER_TEMP/linux-simulation.mcap"
          pnpm fixture:simulation-mcap "$fixture"
          xvfb-run -a pnpm test:integration "$exe" --release
          xvfb-run -a pnpm test:simulation-ui "$exe"
          xvfb-run -a pnpm test:mcap-packaged "$exe" "$fixture"
      - name: Write package checksums
        shell: bash
        working-directory: apps/desktop/release
        run: |
          shopt -s nullglob
          if [[ "$RUNNER_OS" == Windows ]]; then
            packages=(*-windows-x64-portable.zip)
            [[ "${#packages[@]}" -eq 1 ]]
          else
            packages=(*.deb)
            [[ "${#packages[@]}" -eq 1 ]]
          fi
          sha256sum -- "${packages[@]}" > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*-windows-x64-portable.zip
            apps/desktop/release/*.deb
            apps/desktop/release/SHA256SUMS.txt
