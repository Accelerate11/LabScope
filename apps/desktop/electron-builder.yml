appId: com.labscope.desktop
productName: LabScope
copyright: Copyright © 2026 LabScope

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  - from: ../../LICENSE
    to: licenses/LabScope-Apache-2.0.txt
  - from: ../../THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: ../../docs/release/FFMPEG_SOURCE.md
    to: licenses/FFMPEG_SOURCE.md
  - from: ../../third-party/licenses
    to: licenses/third-party/licenses

asar: true
downloadAlternateFFmpeg: true
afterPack: ./build/qualify-runtime.cjs

electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  target:
    - target: zip
      arch:
        - x64
  artifactName: LabScope-${version}-windows-${arch}-portable.${ext}

linux:
  executableName: labscope
  artifactName: LabScope-${version}-linux-${arch}.${ext}
  syncDesktopName: true
  maintainer: LabScope maintainers <261739268+Accelerate11@users.noreply.github.com>
  target:
    - target: deb
      arch:
        - x64
  category: Science

deb:
  packageName: labscope
  artifactName: LabScope-${version}-linux-amd64.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  # M1 has no electron-updater integration.
  packElevateHelper: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LabScope
  deleteAppDataOnUninstall: false
